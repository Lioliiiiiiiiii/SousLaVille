<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>SousLaVille</title>
    <style>
      /* La page entiere est le jeu : ni marge, ni barre de defilement, ni selection
         accidentelle. Un enfant de six ans ne doit rien pouvoir deplacer autour du canvas. */
      html, body {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
        background: #14181F;
        font-family: system-ui, sans-serif;
        -webkit-user-select: none;
        user-select: none;
        overscroll-behavior: none;
      }

      #unity-canvas {
        display: block;
        width: 100vw;
        height: 100vh;
        background: #231F20;
        /* Le jeu est en pixels de 16 : le navigateur ne doit pas les lisser en agrandissant. */
        image-rendering: pixelated;
        outline: none;
      }

      /* Le temps du chargement. Une barre qui se remplit, un mot court, rien d'autre. */
      #chargement {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        background: #14181F;
        color: #C2C8D0;
        font-size: 20px;
        letter-spacing: 2px;
      }

      #barre-vide {
        width: 240px;
        height: 16px;
        border: 2px solid #C2C8D0;
        background: transparent;
      }

      #barre-pleine {
        width: 0%;
        height: 100%;
        background: #C2C8D0;
        transition: width 0.1s linear;
      }

      /* Le bouton plein ecran. Un carre d'au moins 32 px de cote, comme toute zone
         cliquable du jeu, pose dans un coin pour ne jamais couvrir l'action. */
      #plein-ecran {
        position: fixed;
        right: 12px;
        bottom: 12px;
        width: 44px;
        height: 44px;
        border: 2px solid #C2C8D0;
        border-radius: 6px;
        background: rgba(20, 24, 31, 0.6);
        color: #C2C8D0;
        font-size: 22px;
        line-height: 40px;
        text-align: center;
        cursor: pointer;
        opacity: 0.45;
        display: none;
      }

      #plein-ecran:hover {
        opacity: 1;
      }
    </style>
  </head>
  <body>
    <canvas id="unity-canvas" width=960 height=540 tabindex="-1"></canvas>

    <div id="chargement">
      <div>CHARGEMENT</div>
      <div id="barre-vide"><div id="barre-pleine"></div></div>
    </div>

    <div id="plein-ecran" title="Plein écran">&#9974;</div>

    <!--
      LE « ?v= » N'EST PAS DECORATIF. WebBuild pose un numero de version neuf a chaque build.
      Sans lui, deux caches rejouent l'ancien jeu :

      - celui d'Unity, dataCaching, qui garde les fichiers du build dans l'IndexedDB du
        navigateur et les ressert indefiniment tant que l'URL ne bouge pas ;
      - celui de GitHub Pages, qui pose « max-age=600 » et peut donc melanger, dix minutes
        durant, un ancien .wasm avec de nouvelles donnees — ce qui plante avant meme que le
        moteur ne demarre.

      Les deux se voient sur l'URL. Une URL neuve a chaque build les regle tous les deux.
      Constate le 6 septembre 2026 : le jeu servi etait a jour, et le navigateur rejouait
      la version d'avant.
    -->
    <script src="Build/Web.loader.js?v=2026.09.06.1739"></script>
    <script>
      var canvas = document.querySelector("#unity-canvas");
      var version = "2026.09.06.1739";

      createUnityInstance(canvas, {
        arguments: [],
        dataUrl: "Build/Web.data.unityweb?v=" + version,
        frameworkUrl: "Build/Web.framework.js.unityweb?v=" + version,
        codeUrl: "Build/Web.wasm.unityweb?v=" + version,
        streamingAssetsUrl: "StreamingAssets",
        companyName: "Lio",
        productName: "SousLaVille",
        productVersion: "2026.09.06.1739",

        // NON NEGOCIABLE. Sans ceci, tout ce que le jeu ecrit dans persistentDataPath vit
        // en memoire et meurt avec l'onglet : la sauvegarde automatique de la phase 6 ne
        // survivrait pas a une fermeture. Avec ceci, elle part dans l'IndexedDB du
        // navigateur et le joueur retrouve son reseau a la visite suivante.
        autoSyncPersistentDataPath: true,
      }, function (progression) {
        document.querySelector("#barre-pleine").style.width = (100 * progression) + "%";
      }).then(function (instance) {
        document.querySelector("#chargement").style.display = "none";

        var bouton = document.querySelector("#plein-ecran");
        bouton.style.display = "block";
        bouton.onclick = function () {
          instance.SetFullscreen(1);
          // Le clic a donne le focus au bouton : sans ceci, les fleches ne repondraient plus.
          canvas.focus();
        };

        canvas.focus();
      }).catch(function (message) {
        document.querySelector("#chargement").textContent = message;
      });

      // Le canvas doit garder le clavier. Un clic n'importe ou dans la page le lui rend.
      document.addEventListener("pointerdown", function () {
        canvas.focus();
      });

      // Filet : si le navigateur laissait passer les fleches, la page defilerait sous le jeu.
      window.addEventListener("keydown", function (evenement) {
        if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", " "].indexOf(evenement.key) >= 0) {
          evenement.preventDefault();
        }
      }, { passive: false });
    </script>
  </body>
</html>
